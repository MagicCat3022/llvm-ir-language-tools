name: Release

# Pushing a v* tag publishes a GitHub Release with the VSIX attached and the
# version's CHANGELOG section as notes. Run it by hand to (re)publish an
# existing tag; a rerun replaces the attached VSIX.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v1.2.9
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Publish ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      # CI already ran the full matrix on main; this guards a tag placed elsewhere.
      - run: npm test
      - run: npm run package
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v heading="## $VERSION" '
            index($0, heading) == 1 && (length($0) == length(heading) || substr($0, length(heading) + 1, 1) == " ") { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - name: Publish the release
        run: |
          VSIX="llvm-ir-language-tools-$VERSION.vsix"
          test -f "$VSIX"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "$VSIX" --verify-tag --title "LLVM IR Language Tools $VERSION" --notes-file notes.md
          fi
